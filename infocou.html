<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Peta COU Nasional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: title block -> compact filter row -> one full table (No, Region, COU, Penggabungan COU Lain) like the PDF */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13212C; --muted:#6A7A86; --line:#D5DDE3;
  --head:#0A6C74; --head-ink:#FFFFFF; --accent:#0A6C74; --accent-soft:#D9EEEF; --zebra:#F5F8FA;
  --merge:#B45309; --merge-soft:#FCEBD3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1820; --surface:#16242E; --ink:#E8EFF3; --muted:#93A4B0; --line:#2A3C48;
  --head:#0F4C53; --head-ink:#E8EFF3; --accent:#4FC3CB; --accent-soft:#143A40; --zebra:#1A2A35;
  --merge:#F2A950; --merge-soft:#3A2A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#16242E; --ink:#E8EFF3; --muted:#93A4B0; --line:#2A3C48;
  --head:#0F4C53; --head-ink:#E8EFF3; --accent:#4FC3CB; --accent-soft:#143A40; --zebra:#1A2A35;
  --merge:#F2A950; --merge-soft:#3A2A14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{margin:10px 0 0;color:var(--muted)}
.sub b{color:var(--accent);font-weight:600}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search,.sel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.search{flex:1 1 240px}
.sel{flex:0 1 170px}
.search::placeholder{color:var(--muted)}
.tog{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--merge-soft);border-color:var(--merge);color:var(--merge)}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-left:auto}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:560px}
thead th{background:var(--head);color:var(--head-ink);text-align:left;font-weight:600;font-size:13px;letter-spacing:.04em;padding:12px 14px;white-space:nowrap}
tbody td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr.first td{border-top:2px solid var(--accent)}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--accent-soft)}
td.no{font-family:var(--font-mono);font-size:13px;color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
td.reg{white-space:nowrap;width:110px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
td.cou{font-weight:600}
td.mg{color:var(--merge)}
td.mg.none{color:var(--muted)}
mark{background:var(--accent-soft);color:inherit;box-shadow:0 0 0 2px var(--accent-soft);border-radius:2px}
tr:hover mark{background:var(--surface);box-shadow:0 0 0 2px var(--surface)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

@media (max-width:560px){
  thead th,tbody td{padding-left:10px;padding-right:10px}
  .count{margin-left:0;width:100%}
}
</style>

<div class="wrap">
  <header>
    <h1>Daftar COU per Region</h1>
    <p class="sub">Total <b id="tCou">78</b> COU di <b id="tReg">10</b> Region beserta penggabungan COU lain</p>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Cari COU atau penggabungan" aria-label="Cari COU">
    <select class="sel" id="reg" aria-label="Filter region"></select>
    <button class="tog" id="mOnly" aria-pressed="false">Lihat COU yang digabung</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>No</th><th>Region</th><th>COU</th><th>Penggabungan COU Lain</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const RAW = [
[1,"Banda Aceh"],[1,"Langsa"],[1,"Lhokseumawe"],[1,"Medan","Medan 1 & 2"],[1,"Meulaboh"],[1,"Padang Sidempuan"],[1,"Pematang Siantar","Balige"],[1,"Rantau Prapat"],
[2,"Bandar Lampung"],[2,"Batam"],[2,"Bukit Tinggi"],[2,"Dumai","Duri"],[2,"Jambi"],[2,"Muara Bungo"],[2,"Muara Enim"],[2,"Padang"],[2,"Palembang"],[2,"Pangkal Pinang"],[2,"Pekanbaru","Pangkalan Kerinci"],[2,"Rengat"],[2,"Tanjung Balai Karimun"],[2,"Tanjung Pinang"],
[3,"Bogor","Cibinong"],[3,"Bumi Serpong Damai"],[3,"Cikarang","Karawang"],[3,"Depok"],[3,"Dukuh Bawah","Fatmawati 1 & 2"],[3,"Harmoni","Harmoni 1, 2, 3, & Tanjung Priok"],[3,"Jatiwarna","Jatiwarna 1 & 2, Jtw Cpc, Bekasi, Pondok Bambu"],[3,"Serang"],[3,"Tangerang","Tangerang 1 & 2"],
[4,"Bandung","Bandung 1 & 2"],[4,"Cianjur"],[4,"Cirebon","Tegal"],[4,"Garut"],[4,"Subang"],[4,"Sukabumi"],[4,"Tasikmalaya"],
[5,"Magelang"],[5,"Purwokerto","Cilacap"],[5,"Semarang"],[5,"Solo"],[5,"Yogyakarta"],
[6,"Malang"],[6,"Banyuwangi"],[6,"Bojonegoro"],[6,"Jember"],[6,"Kediri"],[6,"Madiun"],[6,"Madura"],[6,"Probolinggo","Pasuruan"],[6,"Sidoarjo"],[6,"Surabaya 1"],[6,"Surabaya 2","Gresik"],[6,"Tulungagung"],
[7,"Balikpapan"],[7,"Banjarmasin","Banjarbaru"],[7,"Bontang"],[7,"Palangkaraya"],[7,"Pontianak"],[7,"Samarinda"],[7,"Sampit"],[7,"Tanah Grogot"],[7,"Tanjung Tabalong"],[7,"Tarakan"],
[8,"Bima"],[8,"Denpasar"],[8,"Kupang","Kefamenanu"],[8,"Mataram","Selong"],[8,"Sumbawa"],
[9,"Kendari","Ambon"],[9,"Makassar"],[9,"Pare Pare","Palopo"],
[10,"Gorontalo"],[10,"Jayapura"],[10,"Manado","Ternate"],[10,"Palu"],[10,"Sorong"]
];
const DATA = RAW.map((r,i)=>({no:i+1,reg:r[0],name:r[1],merged:r[2]||""}));
const REGS = [...new Set(DATA.map(d=>d.reg))];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s,q){
  const e = esc(s); if(!q) return e;
  const i = s.toLowerCase().indexOf(q); if(i<0) return e;
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));
}

$("tCou").textContent = DATA.length;
$("tReg").textContent = REGS.length;
$("reg").innerHTML = `<option value="">Semua region</option>` + REGS.map(r=>`<option value="${r}">Region ${r}</option>`).join("");

function render(){
  const q = $("q").value.trim().toLowerCase(), reg = $("reg").value, mOnly = $("mOnly").getAttribute("aria-pressed")==="true";
  const list = DATA.filter(d=>
    (!reg || d.reg===+reg) && (!mOnly || d.merged) &&
    (!q || d.name.toLowerCase().includes(q) || d.merged.toLowerCase().includes(q)));
  let prev = null;
  $("rows").innerHTML = list.length ? list.map(d=>{
    const first = prev!==null && prev!==d.reg; prev = d.reg;
    return `<tr${first?' class="first"':''}><td class="no">${d.no}</td><td class="reg"><span class="pill">Region ${d.reg}</span></td>
      <td class="cou">${hl(d.name,q)}</td><td class="mg${d.merged?"":" none"}">${d.merged?hl(d.merged,q):"-"}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">Tidak ada COU yang cocok.</td></tr>`;
  $("count").textContent = `${list.length} dari ${DATA.length} COU`;
}
$("q").addEventListener("input",render);
$("reg").addEventListener("change",render);
$("mOnly").addEventListener("click",e=>{const b=e.currentTarget;b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");render()});
render();
</script>

</body></html>
