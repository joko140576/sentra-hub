<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1535">
<title>Sentra Hub – Masuk</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ---------- latar digital ---------- */
body.login-body{
  background:
    radial-gradient(900px 620px at 88% -10%,rgba(77,107,240,.50),transparent 60%),
    radial-gradient(760px 560px at -8% 108%,rgba(233,185,90,.24),transparent 60%),
    radial-gradient(600px 400px at 50% 50%,rgba(39,72,216,.18),transparent 70%),
    linear-gradient(135deg,#050c26 0%,#0b1535 46%,#16277a 125%);
  background-attachment:fixed;color:#fff;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 18%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 18%,transparent 75%)}
.bg-glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite}
.bg-glow.g1{width:360px;height:360px;left:-90px;top:12%;background:rgba(77,107,240,.55)}
.bg-glow.g2{width:320px;height:320px;right:-80px;bottom:6%;background:rgba(233,185,90,.38);animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
#bgNet{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- tata letak ---------- */
.login-wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 0}
.login-in{width:min(440px,100% - 32px);margin-inline:auto}
.login-brand{justify-content:center;margin-bottom:24px;color:#fff}
.login-brand small{color:rgba(255,255,255,.62)}
.login-brand .brand-mark{box-shadow:0 0 0 6px rgba(255,255,255,.07),0 10px 30px rgba(39,72,216,.5)}

/* ---------- kartu kaca ---------- */
.login-card{padding:34px 30px;color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.2);border-radius:26px;
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 30px 80px rgba(2,8,32,.55),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,transparent,#ffe3a1,#e9b95a,transparent);opacity:.9}
.login-card .tag{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;
  background:rgba(233,185,90,.14);border:1px solid rgba(233,185,90,.4);color:#ffe3a1;
  font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.login-card .tag .ic{width:15px;height:15px}
.login-card h1{font-family:'Sora',sans-serif;font-size:27px;letter-spacing:-.02em;line-height:1.2;margin:14px 0 6px;color:#fff}
.login-sub{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:24px}
.login-card .field{margin-bottom:16px}
.login-card .field label{color:rgba(255,255,255,.85)}
.login-card .field input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff}
.login-card .field input::placeholder{color:rgba(255,255,255,.42)}
.login-card .field input:hover{border-color:rgba(255,255,255,.4)}
.login-card .field input:focus{border-color:#e9b95a;box-shadow:0 0 0 4px rgba(233,185,90,.2);background:rgba(255,255,255,.12)}
.login-card .field.err input{border-color:#ff7a8c;box-shadow:0 0 0 4px rgba(255,122,140,.18)}
.login-card .field input:-webkit-autofill{-webkit-text-fill-color:#fff;caret-color:#fff;-webkit-box-shadow:0 0 0 40px #1b2a66 inset;transition:background-color 9999s}
.pw{position:relative}
.pw input{padding-right:48px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:transparent;border-radius:10px;color:rgba(255,255,255,.65);cursor:pointer;display:grid;place-items:center;transition:.2s}
.pw-eye:hover{color:#ffe3a1;background:rgba(255,255,255,.1)}
.pw-eye .ic{width:20px;height:20px}
.login-err{background:rgba(224,54,79,.18);color:#ffc2cb;border:1px solid rgba(255,122,140,.45);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.login-err[hidden]{display:none}
.login-btn{width:100%;padding:14px 22px;font-size:15px}
.login-foot{text-align:center;margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.login-sec{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:rgba(255,255,255,.55)}
.login-sec .ic{width:15px;height:15px;color:#7be0b3}
@media(max-width:480px){.login-card{padding:26px 20px;border-radius:22px}.login-card h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){.bg-glow{animation:none}}
</style>
</head>
<body class="login-body">

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow g1" aria-hidden="true"></div>
<div class="bg-glow g2" aria-hidden="true"></div>
<canvas id="bgNet" aria-hidden="true"></canvas>

<main class="login-wrap">
  <div class="login-in">
    <div class="brand login-brand">
      <div class="brand-mark"><svg class="ic"><use href="#i-bank"/></svg></div>
      <div class="t"><span class="t">SENTRA HUB</span><small>Cash Operations</small></div>
    </div>

    <section class="card login-card">
      <span class="tag"><svg class="ic"><use href="#i-lock"/></svg> Akses Terbatas</span>
      <h1>Masuk ke Sentra Hub</h1>
      <p class="login-sub">Gunakan user dan password yang sudah terdaftar.</p>

      <form id="lf" novalidate>
        <div class="field" id="fUser">
          <label for="user">User</label>
          <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="80" placeholder="Masukkan user" autofocus>
        </div>
        <div class="field" id="fPass">
          <label for="pass">Password</label>
          <div class="pw">
            <input id="pass" name="password" type="password" autocomplete="current-password" maxlength="120" placeholder="Masukkan password">
            <button type="button" class="pw-eye" id="togglePw" aria-label="Tampilkan password"><svg class="ic"><use href="#i-eye"/></svg></button>
          </div>
        </div>
        <div class="login-err" id="err" role="alert" hidden></div>
        <button type="submit" class="btn btn-gold login-btn" id="btnLogin">Masuk</button>
      </form>
      <div class="login-sec"><svg class="ic"><use href="#i-shield"/></svg> Koneksi terenkripsi · sesi otomatis berakhir</div>
    </section>
    <p class="login-foot">Lupa password? Hubungi admin Sentra Hub.</p>
  </div>
</main>

<script>window.SENTRA_PUBLIC = true;</script>
<script src="api.js"></script>
<script>
/* ---------- animasi jaringan titik (latar) ---------- */
(function () {
  "use strict";
  const cv = document.getElementById("bgNet");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, pts = [], raf = 0;
  const LINK = 135;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(24, Math.min(85, Math.round((W * H) / 17000)));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.6 + 1, gold: Math.random() < 0.16
    }));
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK) {
          ctx.strokeStyle = "rgba(140,170,255," + (0.22 * (1 - d / LINK)).toFixed(3) + ")";
          ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const p of pts) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = p.gold ? "rgba(255,213,122,.95)" : "rgba(170,195,255,.85)";
      ctx.shadowColor = p.gold ? "rgba(233,185,90,.9)" : "rgba(77,107,240,.9)"; ctx.shadowBlur = 8;
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  function step() {
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
    }
    draw(); raf = requestAnimationFrame(step);
  }
  function start() { if (!still && !raf) raf = requestAnimationFrame(step); }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(resize, 150); });
  document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
  resize(); start();
})();
</script>
<script>
/* ---------- logika login ---------- */
(function () {
  "use strict";
  const A = window.SentraAPI;
  const $ = (s) => document.querySelector(s);
  const NEXT_OK = /^(index|form|edit)\.html(#[a-z]*)?$/;   // hanya halaman internal
  function nextUrl() {
    const n = new URLSearchParams(location.search).get("next") || "";
    return NEXT_OK.test(n) ? n : "index.html";
  }
  // mode demo (GAS_URL kosong) atau sudah login -> langsung masuk
  if (A.isDemo() || A.getSession()) { location.replace(nextUrl()); return; }

  const err = $("#err"), btn = $("#btnLogin");
  const showErr = (m) => { err.textContent = m; err.hidden = false; };

  $("#togglePw").addEventListener("click", () => {
    const p = $("#pass"), show = p.type === "password";
    p.type = show ? "text" : "password";
    $("#togglePw").setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
  });
  ["#user", "#pass"].forEach((s) => $(s).addEventListener("input", () => {
    err.hidden = true; $("#fUser").classList.remove("err"); $("#fPass").classList.remove("err");
  }));

  $("#lf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = $("#user").value.trim(), pass = $("#pass").value;
    $("#fUser").classList.toggle("err", !user); $("#fPass").classList.toggle("err", !pass);
    if (!user || !pass) { showErr("Isi user dan password."); return; }
    btn.disabled = true; btn.textContent = "Memeriksa…";
    try {
      await A.login(user, pass);
      location.replace(nextUrl());
    } catch (ex) {
      showErr(ex.message === "Failed to fetch" ? "Tidak bisa terhubung ke server. Periksa koneksi internet." : ex.message);
      $("#pass").value = ""; $("#pass").focus();
      btn.disabled = false; btn.textContent = "Masuk";
    }
  });
})();
</script>
</body>
</html>
